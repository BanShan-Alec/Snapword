# Snapword 发版流水线：本地 changelogen 提升版本并推送 v* tag 后自动触发，Windows-only 构建并发布 GitHub Release。
# CI 内不提升版本号——package.json 的版本由 changelogen 的发版提交保证与 tag 一致。
# 手动 dispatch 仅构建不发布，用于验证构建管线。
# Sentry：SENTRY_DSN 注入运行时 DSN（空则生产 Sentry 关闭）；SENTRY_AUTH_TOKEN 存在时
#          Vite 插件才上传 SourceMap，无 token 自动跳过，不影响构建。
name: Release App

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # DSN / ORG / PROJECT 来自仓库内 .env（与 temp5 约定一致）；这里只注入上传 SourceMap 用的 token
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-env

      - name: Build Application (Windows)
        run: pnpm run build:win -- -p never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 中文标题；正文首行给 CHANGELOG 导航（锚定 tag 版本），generate_release_notes 会把 PR 列表追加在其后
          name: ${{ github.ref_name }} 版本发布
          body: |
            📖 完整变更日志见 [CHANGELOG.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)
          files: release-artifacts/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
