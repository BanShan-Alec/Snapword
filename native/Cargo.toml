[workspace]
members = [
    ".",
    "uia-probe",
    "dot-window"
]

[package]
name = "uia-probe-addon"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
uia-probe = { path = "uia-probe" }
dot-window = { path = "dot-window" }

[build-dependencies]
napi-build = "2"
